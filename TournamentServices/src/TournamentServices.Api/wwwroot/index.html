<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mundial</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #1c1c1c;
    }
    body { min-height: 100vh; }
    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(240px, 0.9fr);
      gap: 1rem;
      width: min(1200px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.5rem 0 2rem;
      align-items: start;
    }
    main { min-width: 0; }
    h1 { font-size: 1.7rem; margin: 0; }
    h2 { font-size: 1rem; margin: 0 0 0.5rem; }
    p { margin: 0.35rem 0; }
    .muted { color: #5c6570; }
    form, section {
      background: #fff;
      border: 1px solid #e3e5e8;
      border-radius: 10px;
      padding: 1rem;
      margin-top: 0.8rem;
    }
    label { display: block; font-size: 0.85rem; color: #5c6570; margin-top: 0.65rem; }
    input, button { font: inherit; }
    input {
      width: 100%;
      margin-top: 0.25rem;
      padding: 0.45rem 0.55rem;
      border: 1px solid #d0d4da;
      border-radius: 6px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    button {
      border: 0;
      background: #1456c8;
      color: #fff;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    table { width: 100%; border-collapse: collapse; margin: 0.2rem 0 0.9rem; }
    th, td { text-align: left; padding: 0.35rem 0.25rem; border-bottom: 1px solid #eceff3; }
    th { font-size: 0.78rem; color: #5c6570; font-weight: 600; }
    .champion { font-size: 1.35rem; margin: 0 0 0.8rem; }
    .round { margin-top: 0.8rem; }
    .terminal {
      position: sticky;
      top: 0.8rem;
      background: #1b1f24;
      color: #d7dde5;
      border-radius: 10px;
      min-height: 70vh;
      max-height: calc(100vh - 1.6rem);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .terminal h2 {
      margin: 0;
      padding: 0.75rem 0.9rem;
      font-size: 0.85rem;
      color: #9aa3ad;
      border-bottom: 1px solid #2c323a;
    }
    #log {
      margin: 0;
      padding: 0.8rem 0.9rem 1rem;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.45;
    }
    .ok { color: #7dcea0; }
    .bad { color: #f0a0a0; }
    @media (max-width: 560px) {
      .shell { grid-template-columns: 1fr; }
      .terminal { position: static; min-height: 16rem; max-height: 24rem; }
    }
    @media (max-width: 640px) { .row, .actions { display: block; } button { width: 100%; margin-top: 0.4rem; } }
  </style>
</head>
<body>
  <div class="shell">
  <main>
    <h1>Mundial</h1>
    <p class="muted" id="health">Comprobando el servicio…</p>

    <form id="setup">
      <label>Nombre<input name="name" value="Mundial" required /></label>
      <div class="row">
        <label>Equipos por grupo<input name="maxTeams" type="number" min="2" value="4" required /></label>
        <label>Grupos<input name="groups" type="number" min="1" value="8" required /></label>
      </div>
      <div class="actions"><button type="submit">Crear torneo</button></div>
    </form>

    <section>
      <div class="actions">
        <button type="button" id="btn-groups" disabled>Crear grupos</button>
        <button type="button" id="btn-fill" disabled>Llenar grupos</button>
        <button type="button" id="btn-matches" disabled>Crear partidos</button>
        <button type="button" id="btn-play" disabled>Simular grupos</button>
        <button type="button" id="btn-table" disabled>Ver tabla</button>
        <button type="button" id="btn-champion" disabled>Jugar eliminatoria</button>
      </div>
      <p class="muted" id="status"></p>
    </section>

    <section id="output"></section>
  </main>
  <aside class="terminal">
    <h2>Terminal</h2>
    <pre id="log"></pre>
  </aside>
  </div>
  <script>
    const state = { tournamentId: null };

    const health = document.getElementById("health");
    const status = document.getElementById("status");
    const output = document.getElementById("output");
    const log = document.getElementById("log");
    const buttons = [...document.querySelectorAll("section .actions button")];

    function show(value) {
      if (value == null || value === "") return "";
      if (typeof value === "string") return value;
      return JSON.stringify(value, null, 2);
    }

    function write(method, path, responseStatus, requestBody, responseBody) {
      const mark = responseStatus >= 200 && responseStatus < 300 ? "ok" : "bad";
      const sent = requestBody ? "\n" + show(requestBody) : "";
      const received = responseBody ? "\n" + show(responseBody) : "";
      log.textContent += method + " " + path + " " + responseStatus + sent + received + "\n\n";
      log.scrollTop = log.scrollHeight;
      status.className = "muted " + mark;
    }

    async function call(path, options) {
      const method = (options && options.method) || "GET";
      let requestBody = null;
      if (options && options.body) {
        try { requestBody = JSON.parse(options.body); } catch { requestBody = options.body; }
      }
      const response = await fetch(path, options);
      const text = await response.text();
      let body = null;
      if (text) {
        try { body = JSON.parse(text); } catch { body = text; }
      }
      write(method, path, response.status, requestBody, body);
      status.textContent = response.ok ? "Listo" : "No se pudo completar (" + response.status + ")";
      return { ok: response.ok, status: response.status, body };
    }

    function post(path, body) {
      const options = { method: "POST" };
      if (body !== undefined) {
        options.headers = { "Content-Type": "application/json" };
        options.body = JSON.stringify(body);
      }
      return call(path, options);
    }

    function enable() {
      buttons.forEach((button) => { button.disabled = !state.tournamentId; });
    }

    function teamName(match, side) {
      if (side === "home") return match.homeTeam?.name || match.homeTeamId;
      return match.visitorTeam?.name || match.visitorTeamId;
    }

    function renderGroups(groups) {
      output.innerHTML = groups.map((group) => {
        const names = group.teams.map((team) => team.name).join(", ") || "vacío";
        return "<h2>" + group.name + "</h2><p>" + names + "</p>";
      }).join("");
    }

    function renderTable(groups) {
      output.innerHTML = groups.map((group) => {
        const rows = group.table.map((row, index) =>
          "<tr><td>" + (index + 1) + "</td><td>" + row.name + "</td><td>" + row.wins +
          "</td><td>" + row.goalsFor + "</td><td>" + row.goalsAgainst + "</td></tr>"
        ).join("");
        return "<h2>" + group.groupName + "</h2><table><thead><tr><th></th><th>Equipo</th><th>Victorias</th><th>GF</th><th>GC</th></tr></thead><tbody>" + rows + "</tbody></table>";
      }).join("");
    }

    function renderChampion(result) {
      const rounds = (result.rounds || []).map((round) => {
        const lines = round.matches.map((match) =>
          "<p>" + teamName(match, "home") + " " + match.score.homeTeamScore + " - " +
          match.score.visitorTeamScore + " " + teamName(match, "visitor") + "</p>"
        ).join("");
        return "<div class='round'><h2>Ronda " + round.round + "</h2>" + lines + "</div>";
      }).join("");
      output.innerHTML = "<p class='champion'>Campeón: " + result.name + "</p>" + rounds;
    }

    document.getElementById("setup").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      const result = await post("/tournaments", {
        name: data.get("name"),
        format: {
          maxTeamsPerGroup: Number(data.get("maxTeams")),
          numberOfGroups: Number(data.get("groups"))
        }
      });
      if (!result.ok) return;
      state.tournamentId = result.body.id;
      enable();
      output.innerHTML = "<p>Torneo creado.</p>";
    });

    document.getElementById("btn-groups").addEventListener("click", async () => {
      const result = await post("/tournaments/" + state.tournamentId + "/groups/generate");
      if (result.ok) renderGroups(result.body);
    });

    document.getElementById("btn-fill").addEventListener("click", async () => {
      const result = await post("/tournaments/" + state.tournamentId + "/groups/fill");
      if (result.ok) renderGroups(result.body);
    });

    document.getElementById("btn-matches").addEventListener("click", async () => {
      const result = await post("/tournaments/" + state.tournamentId + "/matches/generate");
      if (!result.ok) return;
      output.innerHTML = "<p>" + result.body.length + " partidos creados, todos 0-0.</p>";
    });

    document.getElementById("btn-play").addEventListener("click", async () => {
      const result = await post("/tournaments/" + state.tournamentId + "/matches/simulate");
      if (!result.ok) return;
      output.innerHTML = "<p>Fase de grupos jugada. " + result.body.length + " partidos.</p>";
    });

    document.getElementById("btn-table").addEventListener("click", async () => {
      const result = await call("/tournaments/" + state.tournamentId + "/standings");
      if (result.ok) renderTable(result.body);
    });

    document.getElementById("btn-champion").addEventListener("click", async () => {
      const result = await post("/tournaments/" + state.tournamentId + "/knockout");
      if (result.ok) renderChampion(result.body);
    });

    call("/health").then((result) => {
      health.textContent = result.ok ? "Servicio en línea" : "El servicio no responde";
    });
  </script>
</body>
</html>
