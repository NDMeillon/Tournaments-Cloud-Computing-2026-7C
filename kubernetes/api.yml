apiVersion: apps/v1
kind: Deployment
metadata:
  name: tournaments-api
  namespace: tournaments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tournaments-api
  template:
    metadata:
      labels:
        app: tournaments-api
    spec:
      containers:
      - name: api
        image: localhost/tournaments-api:dev
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            cpu: 100m
          limits:
            cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: tournaments-api
  namespace: tournaments
spec:
  type: NodePort
  selector:
    app: tournaments-api
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
