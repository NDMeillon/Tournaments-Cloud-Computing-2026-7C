# Sólo para desarrollo local. Nunca publicar contraseñas reales en Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tournaments-app-config
  namespace: tournaments
data:
  # Nombre exacto que lee Program.cs mediante GetConnectionString("DefaultConnection").
  ConnectionStrings__DefaultConnection: "Host=tournament-db.tournaments.svc.cluster.local;Port=5432;Database=tournament_db;Username=tournament_svc;Password=password"
  # Necesario: appsettings.json contiene Urls=http://localhost:8080;
  # dentro del Pod el servidor debe escuchar en todas las interfaces.
  ASPNETCORE_URLS: "http://0.0.0.0:8080"
