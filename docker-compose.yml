services:
  db:
    image: postgres:16-alpine
    container_name: tournament-db
    environment:
      POSTGRES_DB: tournament_db
      POSTGRES_USER: tournament_svc
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - tournament_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournament_svc -d tournament_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  tournament_pg:
